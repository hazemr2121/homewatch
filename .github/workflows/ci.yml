name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  notifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notifier/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
      - name: Build notifier image
        run: docker build -t homewatch-notifier ./notifier
