mqtt:
  enabled: true
  host: mosquitto
  port: 1883

# CPU detection is fine for 1 camera at 5 fps.
# For more cameras, add a Coral or OpenVINO detector (see Frigate docs).
detectors:
  cpu:
    type: cpu
    num_threads: 2

# go2rtc pulls ONE connection from the camera and restreams it locally
# (to Frigate, the web UI live view, and anything else on your LAN).
go2rtc:
  streams:
    outdoor:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_CAMERA_IP}:554/stream1 # main (2K)
    outdoor_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{FRIGATE_CAMERA_IP}:554/stream2 # sub (360p)

cameras:
  outdoor:
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-aac
      inputs:
        - path: rtsp://127.0.0.1:8554/outdoor
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/outdoor_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person, car, dog, cat]
      filters:
        person:
          min_score: 0.6
          threshold: 0.75
    record:
      enabled: true
      retain:
        days: 3
        mode: motion
    snapshots:
      enabled: true
      bounding_box: true
      retain:
        default: 7
    # Draw motion masks and zones in the UI: Settings -> Masks / Zones.
